[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tbx11k-data"
version = "0.1.0"
description = "Preparación reproducible de TBX11K sin entrenamiento local"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "Pillow>=10.4,<14"]

[tool.setuptools.packages.find]
where = ["src"]
